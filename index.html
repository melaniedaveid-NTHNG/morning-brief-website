<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief</title>
<meta name="description" content="Daily morning brief and tech news library.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-grain" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="hero-top">
        <div class="hero-top-left">
          <span class="brand"><span class="dot" aria-hidden="true"></span>Morning&nbsp;Brief</span>
          <span class="weather-chip" id="weather-chip" aria-live="polite"></span>
        </div>
        <button id="theme-toggle" class="pill-btn" type="button" aria-label="Toggle theme">
          <span id="theme-toggle-label">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="tabs-bar" role="tablist" aria-label="View">
    <button class="tab active" data-view="today" role="tab" aria-selected="true">Today</button>
    <button class="tab" data-view="library" role="tab" aria-selected="false">Library</button>
  </nav>

  <main id="main">
    <section id="view-today" class="view" data-view-panel="today">
      <div id="today-content" class="day-content">
        <p class="loading">Loading today&rsquo;s brief&hellip;</p>
      </div>
    </section>

    <section id="view-library" class="view" data-view-panel="library" hidden>
      <div class="library-feed" id="library-feed">
        <p class="loading">Loading library&hellip;</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span class="dot dot-sm" aria-hidden="true"></span>
    <p>Sources — The Verge, MIT Technology Review, Wired</p>
  </footer>
</div>

<template id="day-template">
  <div class="day">
    <p class="brief-date" data-slot="date"></p>
    <div class="brief-block" data-slot="brief"></div>
    <div class="news-columns" data-slot="news"></div>
  </div>
</template>

<template id="news-source-template">
  <div class="news-source">
    <h3 class="news-source-title"></h3>
    <ul class="news-items"></ul>
  </div>
</template>

<template id="news-item-template">
  <li class="news-item">
    <a class="news-item-title" target="_blank" rel="noopener"></a>
    <p class="news-item-summary"></p>
    <span class="news-item-meta"></span>
  </li>
</template>

<script src="assets/js/app.js"></script>
</body>
</html>
